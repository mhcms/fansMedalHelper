USERS:
    - access_key: XXXXXX # 注意冒号后的空格 否则会读取失败 英文冒号
      white_uid: 0 # 白名单用户ID, 可以是多个用户ID, 以逗号分隔,填写后只会打卡这些用户,黑名单失效，不用就填0
      banned_uid: 0 # 黑名单UID 同上,填了后将不会打卡，点赞，分享 用英文逗号分隔 不填则不限制,两个都填0则不限制,打卡所有直播间
    - access_key:
      white_uid: 0
      banned_uid: 0
    # 注意对齐
    # 多用户以上格式添加
    # 井号后为注释 井号前后必须有空格！井号前后必须有空格！井号前后必须有空格！
    # 冒号后面也要有空格！冒号前面也要有空格！冒号前面也要有空格！
    # 英文冒号,英文逗号！英文逗号！英文逗号！
WRITE_LOG_FILE: False
# 是否写入日志文件
# 填写True时使用默认目录（运行目录log文件夹下）
# 填写绝对路径时写入指定log文件位置
# 不填或填写False则不写入日志文件

CRON: # 5 0 * * *
# 这里是 cron 表达式, 第一个参数是分钟, 第二个参数是小时
# 例如每天凌晨0点5分执行一次为 5 0 * * *
# 如果不填,则不使用内置定时器,填写正确后要保持该进程一直运行

SENDKEY: # Server酱微信推送 可选 获取地址：https://sct.ftqq.com/
MOREPUSH: # 更多种类的推送 详细配置见文档

PROXY: # 推送代理地址,如：http://1.2.3.4:5678 支持 http/socks4/socks5 不支持 https 不用代理的不用填

SMART_START: true # 智能启动模式，如果启动时已错过定时执行时间，则立即执行一次
# true: 启动时如果错过了今天的定时执行时间，立即执行
# false: 严格按照定时器执行，不主动补执行
# "always": 每次启动都立即执行一次，然后按定时器执行

#########以下为自定义配置#########

ASYNC: 0 # 异步执行,默认同步执行,设置为1则异步执行

LIKE_CD: 3 # 点赞间隔时间,单位秒,默认3秒,设置为0则不点赞

DANMAKU_CD: 6 # 弹幕间隔时间,单位秒,默认6秒,设置为0则不发弹幕打卡,只能同步打卡

# ===== 弹幕任务相关配置 =====
DANMAKU_NUM: 1 # 设置弹幕发送数量，快速解决B站调整点亮规则

DANMAKU_CHECK_LIGHT: 0 # 是否仅未点亮的粉丝牌发送弹幕,默认关闭,设置为1则开启

DANMAKU_CHECK_LEVEL: 1 # 发送弹幕是否包含高等级粉丝牌,默认开启,设置为0则关闭（适用于所有等级）

# 自定义弹幕内容，如果不填或留空则使用默认内容
# 用户可以根据自己的喜好修改弹幕内容，支持表情符号、中文、英文等
# 注意：弹幕内容要符合B站社区规范，避免敏感词汇
DANMAKU_TEXTS:
  - "(⌒▽⌒)."
  - "（￣▽￣）."
  - "(=・ω・=)."
  - "(｀・ω・´)."
  - "(〜￣△￣)〜."
  - "(･∀･)."
  - "(°∀°)ﾉ."
  - "(￣3￣)."
  - "╮(￣▽￣)╭."
  - "_(:3」∠)_."
  - "(^・ω・^ )."
  - "(●￣(ｴ)￣●)."
  - "ε=ε=(ノ≧∇≦)ノ."
  - "⁄(⁄ ⁄•⁄ω⁄•⁄ ⁄)⁄."
  - "←◡←."
# 用户可以添加更多弹幕内容，例如：
# - "加油~"
# - "支持主播"
# - "6666"
# - "来了来了"

WATCHINGLIVE: 25 # 每日每直播间观看时长，单位 min ，设置为0则关闭, 默认 25 分钟
# 新规则：每5分钟获得6亲密度，最多30亲密度，所以25分钟正好获得满额亲密度
# 总观看时长为未满30亲密度牌子数*每直播间观看时长

WEARMEDAL: 0 # 是否弹幕打卡时自动带上当前房间的粉丝牌，避免房间有粉丝牌等级禁言，默认关闭，设置为1则开启

SIGNINGROUP: 2 # 应援团签到CD时间,单位秒,默认2秒,设置为0则无延时签到,设置为false则关闭签到
# 说明：
# 本项目中的异步执行指的是：同时点赞、弹幕、应援团签到等任务，速度非常快，但缺点就是可能会被B站吞掉亲密度，所以建议粉丝牌较少的用户开启异步执行
# 观看直播任务无论在异步还是同步模式下，都必须一个房间一个房间地顺序执行，因为B站的心跳包机制需要维护连续的观看状态
# 粉丝牌数大于30的用户建议使用同步，会更加稳定。缺点就是速度比较慢，但是可以设置点赞和弹幕的CD时间，避免被B站吞掉亲密度
# 多用户之间依然是异步，不受配置影响
